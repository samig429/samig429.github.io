<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sami Ghimire | Introduction Form</title>

    <link rel="icon" href="images/guineapig.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/default.css">
</head>

<body>

<div data-include="components/header.html"></div>

<main>
    <h2>Introduction Form</h2>

        <h3>Please submit the form below.</h3>

    
        <form id="form">

    <fieldset>
        <legend><strong>Personal Information</strong></legend>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" value="Samikshya" placeholder="First Name" required>

        <br><br>

        <label for="middleName">Middle Name (Optional):</label>
        <input type="text" id="middleName" placeholder="Middle Name">

        <br><br>

        <label for="preferredName">Preferred Name (Optional):</label>
        <input type="text" id="preferredName" value="Sami" placeholder="Nickname">

        <br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" value="Ghimire" placeholder="Last Name" required>
    </fieldset>

    <fieldset>
        <legend><strong>Acknowledgment</strong></legend>

        <label for="acknowledgment">Acknowledgment Statement:</label>
        <textarea id="acknowledgment" required>I understand that what is on this page is not password protected and I will not put anything here that I don't want publicly available.</textarea>

        <br><br>

        <label for="ackdate">Acknowledgment Date:</label>
        <input type="text" id="ackdate" required>
    </fieldset>

    <fieldset>
        <legend><strong>Mascot</strong></legend>

        <label for="mascotAdjective">Mascot Adjective:</label>
        <input type="text" id="mascotAdjective" value="Shy" required>

        <br><br>

        <label for="mascotAnimal">Mascot Animal:</label>
        <input type="text" id="mascotAnimal" value="Guinea Pig" required>

        <br><br>

        <label for="divider">Divider:</label>
        <input type="text" id="divider" value="❀" required>
    </fieldset>

    <fieldset>
        <legend><strong>Pictures</strong></legend>

        <img id="previewImage"
             src="images/Sami_Studying.jpg"
             alt="Sami studying"
             width="250">

        <br><br>

        <label for="picture">Upload New Picture:</label>
        <input type="file" id="picture" accept="image/*">

        <br><br>

        <label for="pictureCaption">Picture Caption:</label>
        <input type="text"
               id="pictureCaption"
               value="Studying at Atkins Library"
               required>
    </fieldset>

    <fieldset>
        <legend><strong>Introduction Information</strong></legend>

        <label for="personalStatement">Personal Statement</label>
<textarea id="personalStatement" required>
I enjoy learning new technologies and solving programming problems.
</textarea>

        <br><br>

        <label for="professionalBackground">Professional Background</label>
        <textarea id="professionalBackground" required>I've worked as a coding teacher for several schools and currently work as a substitute teacher at a charter school. I enjoy helping students learn programming fundamentals.</textarea>

        <br><br>

        <label for="academicBackground">Academic Background</label>
        <textarea id="academicBackground" required>I'm a senior Computer Science major at UNC Charlotte with a concentration in Artificial Intelligence, Gaming, and Robotics.</textarea>

        <br><br>

        <label for="subjectBackground">Background in this Subject</label>
        <textarea id="subjectBackground" required>I have limited experience with front-end web development, so I'm excited to build a stronger foundation in HTML, CSS, and JavaScript through this course.</textarea>

        <br><br>

        <label for="platform">Primary Computer Platform</label>
        <textarea id="platform" required>2020 13-inch MacBook Air (primary) and a 2016 Dell XPS 13 as backup.</textarea>
    </fieldset>

    <fieldset>

        <legend><strong>Courses</strong></legend>

        <div id="courses">

            <div class="course">

                <input type="text" value="ITIS" placeholder="Department">

                <input type="text" value="3135" placeholder="Number">

                <input type="text" value="Web-Based Application Design" placeholder="Course Name">

                <input type="text" value="To gain experience with front-end web development." placeholder="Reason">

            </div>

            <br><br>

            <div class="course">

                <input type="text" value="ITCS">

                <input type="text" value="3156">

                <input type="text" value="Machine Learning">

                <input type="text" value="To deepen my understanding of Machine Learning and Artificial Intelligence.">

            </div>

            <br><br>

            <div class="course">

                <input type="text" value="ITSC">

                <input type="text" value="3155">

                <input type="text" value="Software Engineering">

                <input type="text" value="Required course that teaches valuable software development skills.">

            </div>

            <br><br>

            <div class="course">

                <input type="text" value="ITCS">

                <input type="text" value="3153">

                <input type="text" value="Artificial Intelligence">

                <input type="text" value="To continue learning more about Artificial Intelligence.">

            </div>

        </div>

        <br><br>

        <button type="button" id="addCourse">Add Course</button>

    </fieldset>

    <fieldset>

        <legend><strong>Additional Information</strong></legend>

        <label for="funnyThing">Funny Thing</label>

        <textarea id="funnyThing">I once won a geography bee completely by accident.</textarea>

        <br><br>
        
        <label for="share">Something I'd Like to Share</label>

        <textarea id="share">I recently traveled to Iceland, and I hope to continue exploring new places around the world.</textarea>

        <br><br>
        
        <label for="quote">Favorite Quote</label>

        <textarea id="quote">Whatever you are, be a good one.</textarea>

        <br><br>
        
        <label for="quoteAuthor">Quote Author</label>

        <input type="text" id="quoteAuthor" value="Abraham Lincoln">

    </fieldset>

    

    <fieldset>

        <legend><strong>Links</strong></legend>

        <br><br>

        <input type="url" value="https://www.linkedin.com/in/samikshya-ghimire-a300291b6/" placeholder="LinkedIn">
        
        <br><br>

        <input type="url" value="https://github.com/samig429" placeholder="GitHub">

        <br><br>

        <input type="url" value="https://samig429.github.io/" placeholder="GitHub Pages">

        <br><br>

        <input type="url" value="https://www.freecodecamp.org/sghimire" placeholder="FreeCodeCamp">

        <br><br>

        <input type="url" value="https://www.codecademy.com/profiles/sghimire2022" placeholder="Codecademy">

    </fieldset>

    <br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    <button type="button" id="clearButton">Clear</button>
    <button type="button" onclick="generateHTML()">Generate HTML</button>
    <button type="button" onclick="generateJSON()">Generate JSON</button>
    <button type="button" onclick="generateXML()">Generate XML</button>


</form>

<div id="output"></div>

<h2>Generated Code</h2>

<textarea
id="codeOutput"
rows="25"
cols="90"
readonly>
</textarea>


<script src="scripts/introduction.js"></script>

</main>


<div data-include="components/footer.html"></div>



<script src="scripts/HTMLInclude.min.js"></script>

</body>


</html>
