<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sami Ghimire's Shy Guinea Pig | ITIS3135 | Survey</title>

    <link rel="icon" href="images/guineapig.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/default.css">

    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>

<div data-include="components/header.html"></div>

<main>

<h2>Front End Development Survey</h2>

<section>

<p>
    Hello! Please fill out this survey so I know who is looking at my website!
</p>

<h3>Personal Information</h3>

<form>

<label for="name">Name:</label>
<input type="text" id="name" name="name">

<br><br>

<label for="email">Email:</label>
<input type="email" id="email" name="email">

<br><br>

<label for="favorite">How did you find out about this:</label>

<select id="favorite" name="favorite">
    <option>We are in a class together</option>
    <option>We are friends</option>
    <option>I watch your content</option>
    <option>Other</option>
</select>

<br><br>

<p>How would you describe your experience with me?</p>

<input type="radio" id="daily" name="reading">
<label for="daily">Good</label>

<input type="radio" id="weekly" name="reading">
<label for="weekly">Ok</label>

<input type="radio" id="monthly" name="reading">
<label for="monthly">Bad</label>

<br><br>

<label for="comments">Anything you want to tell me?</label>

<br>

<textarea id="comments" name="comments" rows="5" cols="40"></textarea>

<br><br>

<button type="submit">Submit Survey</button>

<img src="images/Sami_Studying.jpg" alt="Books books & more books">

</form>

</section>

</main>

<div data-include="components/footer.html"></div>

<script src="scripts/HTMLInclude.min.js"></script>
<script src="https://divonbriesen.github.io/web123/scripts/standards-check.js" defer></script>
</body>
</html>
